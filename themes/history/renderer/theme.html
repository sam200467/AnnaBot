<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../shared/fonts.css">
  <link rel="stylesheet" href="theme.css">
  <script src="../../shared/theme-kit.js"></script>
</head>
<body>
  <main id="page">
    <div class="scene"><img class="painting" src="../assets/painting.jpg" alt=""><div class="shade"></div></div>
    <img class="fullbody" src="../assets/idea-fullbody.png" alt="创造神伊迪亚完整立绘">
    <div class="content">
      <header><div><h1>推分记录</h1><p id="batch-time"></p></div><div class="account"><span>当前 Rating</span><strong id="account-rating"></strong></div></header>
      <section class="overview material"><div class="before-after"><label>本次 B50 均值</label><div><b id="before"></b><span class="arrow">⟶</span><b id="after"></b></div></div><div class="impact"><label>本次提升</label><strong id="impact"></strong></div><div class="totals"><span id="total"></span></div></section>
      <div class="tables">
        <section class="panel material composition"><h2>B50 构成变化</h2><p class="table-note" id="composition-note"></p><div id="changes"></div><div id="unchanged" hidden><div class="unchanged-seal">B50</div><h3>席位未改变</h3><p>本次更新没有改变<br>旧曲 B30 与新曲 B20 的构成</p><div id="outside-summary"></div></div><p class="omission" id="change-omission"></p></section>
        <section class="panel material details"><h2>本次成绩更新</h2><p class="table-note" id="detail-note"></p><div id="events"></div><p class="omission" id="detail-omission"></p></section>
      </div>
      <footer><div id="credit"></div><p>按上传时间归批 · 北京时间 · B50 按当前定数及新旧曲分组重算</p></footer>
    </div>
    <img class="frame" src="../assets/frame-cassetta.webp" alt="">
  </main>
  <script src="theme.js"></script>
</body>
</html>
