<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../shared/fonts.css">
  <link rel="stylesheet" href="theme.css">
  <script src="../../shared/theme-kit.js"></script>
</head>
<body>
  <main id="page">
    <img class="painting" src="../assets/painting.jpg" alt="">
    <div class="shade"></div>
    <div class="frame" id="frame"></div>
    <div class="content">
      <header class="masthead">
        <div><div class="eyebrow">CHUNITHM · SIBYLLA</div><h1>推分记录</h1><div id="range" class="range"></div></div>
        <div class="headline-stats" id="stats"></div>
      </header>
      <section class="panel overview">
        <h2><span>Ⅰ</span> Rating 轨迹</h2>
        <div class="overview-grid">
          <div class="chart-wrap"><div class="panel-note" id="curve-note"></div><svg id="chart" viewBox="0 0 1160 420"></svg><div class="chart-foot" id="chart-foot"></div></div>
          <aside class="portrait"><div class="portrait-arch"><img src="../assets/idea.png" alt="创造神 伊迪亚"></div><div class="portrait-name">創造神 イデア</div><div class="portrait-line"></div><div class="portrait-sub">希望と絶望の箱庭</div></aside>
        </div>
      </section>
      <section class="panel composition">
        <h2><span>Ⅱ</span> B50 构成变化</h2>
        <div class="panel-note" id="composition-note"></div>
        <div class="composition-grid"><div><h3>新进与提升 <small id="gains-count"></small></h3><div id="gains"></div></div><div><h3>移出 <small id="loss-count"></small></h3><div id="losses"></div></div></div>
      </section>
      <section class="panel details">
        <h2><span>Ⅲ</span> 推分明细</h2>
        <div class="panel-note" id="detail-note"></div>
        <div id="batches"></div>
      </section>
      <footer><div>Generated by Anna Bot · 数据来自落雪查分器 <span id="sample"></span></div><div id="page-no"></div><p>按上传时间归批 · 北京时间 · B50 按当前定数与新旧曲分组重算</p></footer>
    </div>
  </main>
  <script src="theme.js"></script>
</body>
</html>
