<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../shared/fonts.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="../../shared/rating-tiers.css">
  <script src="../../shared/theme-kit.js"></script>
</head>
<body>
  <main id="page">
    <div class="scene"><img class="painting" id="painting" alt=""><div class="shade"></div></div>
    <img class="fullbody" id="salacia" alt="原初的巫女萨拉基亚">
    <div class="content" id="content">
      <header>
        <div class="title"><h1>热门谱面</h1><p id="subtitle"></p></div>
        <!-- 玩家的名片板（照 /年度总结）：萨拉基亚的冠在右栏最上面，所以放在左栏抬头的右边 -->
        <aside id="identity" class="identity">
          <div class="portrait">
            <div class="medallion"><img id="chara" class="chara" alt=""></div>
            <div id="emblem" class="emblem"></div>
          </div>
          <div id="plate" class="plate">
            <img id="plate-img" class="plate-img" alt="">
            <div id="trophy" class="trophy"></div>
            <div class="plate-name"><span class="who"><span id="level" class="level"></span><span id="name" class="name"></span></span></div>
            <div class="overall rating-floor"><span class="overall-label">总 Rating</span><span id="rating" class="overall-value"></span></div>
          </div>
        </aside>
      </header>
      <div class="boards" id="boards"></div>
    </div>
    <footer><p id="credit"></p></footer>
    <div class="frame" id="frame"></div>
  </main>
  <script src="theme.js"></script>
</body>
</html>
