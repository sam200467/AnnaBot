<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../shared/fonts.css">
  <link rel="stylesheet" href="theme.css">
  <script src="../../shared/theme-kit.js"></script>
</head>
<body>
  <main id="page">
    <div class="scene"><img src="../assets/painting.jpg" alt=""><div class="shade"></div></div>
    <img class="fullbody" id="meve" src="../assets/meve-fullbody.png" alt="原初的风之巫女梅薇">
    <!-- 右上角、梅薇头顶上方的天空里是玩家的名片板：名牌版、称号、★转生 Lv.等级 + 名字、角色头像和段位，
         下面补一行总 Rating（作者 2026-10-20 要的，跟 /分数列表 的名片板一样） -->
    <aside id="identity" class="identity">
      <div class="portrait">
        <div class="medallion"><img id="chara" class="chara" alt=""></div>
        <div id="emblem" class="emblem"></div>
      </div>
      <div id="plate" class="plate">
        <img id="plate-img" class="plate-img" alt="">
        <div id="trophy" class="trophy"></div>
        <div class="plate-name"><span class="who"><span id="level" class="level"></span><span id="name" class="name"></span></span></div>
        <div class="overall"><span class="overall-label">总 Rating</span><span id="rating" class="overall-value"></span></div>
      </div>
    </aside>
    <div class="content">
      <header>
        <div><h1>分表变化 <span id="period"></span></h1><p id="range"></p></div>
        <div class="updates"><p id="updates"></p></div>
      </header>
      <div class="charts" id="charts"></div>
      <footer>
        <p>按上传时间记录 · 北京时间 · 各图独立纵轴 · B50 = B30 × 0.6 + N20 × 0.4</p>
        <p>依现存上传记录、当前定数及新旧曲分组重算，空位计零 · <span id="credit"></span></p>
      </footer>
    </div>
    <canvas id="frame"></canvas>
  </main>
  <script src="frame.js"></script>
  <script src="theme.js"></script>
</body>
</html>
