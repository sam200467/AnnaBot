<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../shared/fonts.css">
  <link rel="stylesheet" href="theme.css">
  <script src="../../shared/theme-kit.js"></script>
</head>
<body>
  <main id="page" class="page">
    <div id="painting" class="painting"><img src="../assets/painting.jpg" alt=""></div>
    <div id="sibyl" class="sibyl mirror"><img src="../assets/juna-fullbody.png" alt=""></div>
    <div id="veil" class="veil"></div>
    <div id="painting-shade" class="painting-shade"></div>

    <div id="content" class="content">
      <header class="song">
        <div id="jacket" class="jacket"><img id="jacket-img" alt=""></div>
        <div class="info">
          <h1 id="title" class="title"></h1>
          <div class="byline"><p id="artist" class="artist"></p><div id="kin" class="kin"></div></div>
          <dl id="facts" class="facts"></dl>
          <div id="notes" class="notes"></div>
        </div>
      </header>

      <section id="lines" class="panel plate">
        <h2 class="ribbon">分数线 · 容错</h2>
        <p id="unit" class="aside"></p>
        <div id="line-table" class="line-table"></div>
      </section>

      <section id="mine" class="panel plate">
        <h2 class="ribbon">你的成绩</h2>
        <p id="plays" class="aside"></p>
        <div class="mine-body">
          <div id="summary" class="summary"></div>
          <div id="history" class="history"></div>
        </div>
      </section>

      <p id="credit" class="credit"></p>
    </div>

    <div id="frame" class="frame"></div>
  </main>
  <script src="theme.js"></script>
</body>
</html>
